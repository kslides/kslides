name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions: {}

# Allow one Pages deployment at a time; queue rather than cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      pages: read # configure-pages reads the site's Pages settings
    defaults:
      run:
        working-directory: website/kslides
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Generate Dokka HTML
        working-directory: ${{ github.workspace }}
        run: ./gradlew :dokkaGenerate --no-daemon
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          working-directory: website
      - run: uv sync --project ../ --frozen
      - run: uv run --project ../ zensical build --clean
      - name: Copy Dokka HTML into the published site
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p website/kslides/site/api-docs
          cp -R build/dokka/html/. website/kslides/site/api-docs/
      - name: Copy example slides into the published site
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p website/kslides/site/docs
          cp -R docs/. website/kslides/site/docs/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/kslides/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the Pages deployment
      id-token: write # request the OIDC token that verifies the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
