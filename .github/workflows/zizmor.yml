name: zizmor

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit GitHub Actions
    runs-on: ubuntu-latest
    # Findings go to the code-scanning (Security) tab, and the job does not fail on them;
    # gate merges with a code-scanning ruleset instead.
    permissions:
      security-events: write # upload zizmor's SARIF results to code scanning

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
