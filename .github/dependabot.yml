version: 2

updates:
  # Keeps the workflows' action pins (SHA + "# vX.Y.Z" comment) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The Zensical docs site under website/.
  - package-ecosystem: uv
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]
